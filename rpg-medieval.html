<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crónicas de Valdoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0b14; --fg:#e8dcc0; --muted:#8a8296; --gold:#c9a25a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Press Start 2P", monospace; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding-top:env(safe-area-inset-top); }
  #game { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000;
    box-shadow:0 0 0 2px #2a2238, 0 0 0 4px var(--gold), 0 8px 40px rgba(0,0,0,.6); }
  #help { font-size:8px; color:var(--muted); text-align:center; line-height:1.8; padding:0 16px; }
  #pad { display:none; width:100%; max-width:520px; justify-content:space-between; align-items:center;
    padding:0 max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  body.touch #pad { display:flex; }
  body.touch #help { display:none; }
  .dpad { position:relative; width:150px; height:150px; }
  .dpad button, .ab button, .mini button { position:absolute; border:2px solid var(--gold); background:#22203a; color:var(--fg);
    font-family:inherit; font-size:12px; border-radius:6px; touch-action:none; }
  .dpad button:active, .dpad button.on, .ab button.on, .mini button.on { background:#4a3f6b; }
  .dpad .u { left:50px; top:0; width:50px; height:50px; }
  .dpad .d { left:50px; top:100px; width:50px; height:50px; }
  .dpad .l { left:0; top:50px; width:50px; height:50px; }
  .dpad .r { left:100px; top:50px; width:50px; height:50px; }
  .ab { position:relative; width:150px; height:130px; }
  .ab .a { right:0; top:10px; width:64px; height:64px; border-radius:50%; font-size:16px; }
  .ab .b { right:76px; top:56px; width:64px; height:64px; border-radius:50%; font-size:16px; }
  .mini { position:relative; width:0; height:0; }
  .mini button { left:-24px; top:-80px; width:48px; height:28px; font-size:8px; position:absolute; }
</style>
</head>
<body>
<canvas id="game" width="320" height="240" aria-label="Crónicas de Valdoria, juego de rol"></canvas>
<div id="help">Flechas / WASD: mover &nbsp;·&nbsp; Z / Enter / Espacio: hablar y aceptar &nbsp;·&nbsp; X / Esc: menú y volver &nbsp;·&nbsp; M: música</div>
<div id="pad">
  <div class="dpad">
    <button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button>
    <button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button>
  </div>
  <div class="mini"><button data-k="mute">♪</button></div>
  <div class="ab"><button class="b" data-k="cancel">B</button><button class="a" data-k="ok">A</button></div>
</div>

//  Todo (gráficos, mapas, música) se genera en este archivo.

ctx.imageSmoothingEnabled = false;

// ---------- utilidades ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = n => Math.floor(Math.random()*n);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function hash(x,y){ let h = (x*374761393 + y*668265263) | 0; h = (h ^ (h>>>13)) * 1274126177 | 0; return (h ^ (h>>>16)) >>> 0; }
function fmtTime(fr){ const s=Math.floor(fr/60); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

// ---------- paleta ----------
const PAL = { k:'#1a1c2c', x:'#000000', w:'#f4f4f4', s:'#f2c3a0', S:'#c98a6b', h:'#6b3e1f', n:'#8b5a2b', N:'#4a2c14',
  t:'#d9a066', r:'#b13e53', R:'#6e1f35', o:'#ef7d57', y:'#ffcd75', l:'#a7f070', g:'#38b764', G:'#257179',
  b:'#3b5dc9', B:'#29366f', c:'#41a6f6', C:'#73eff7', e:'#94b0c2', E:'#566c86', d:'#333c57', p:'#5d275d', P:'#9e5bb8' };

function spr(rows, remap={}){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=mk(w,h), g=c.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=rows[y][x]; if(!ch || ch==='.') continue;
    let col = remap[ch]!==undefined ? remap[ch] : ch;
    col = col[0]==='#' ? col : PAL[col]; if(!col) continue;
    g.fillStyle=col; g.fillRect(x,y,1,1);
  }
  return c;
}
function silhouette(src,color){ const c=mk(src.width,src.height), g=c.getContext('2d'); g.drawImage(src,0,0); g.globalCompositeOperation='source-in'; g.fillStyle=color; g.fillRect(0,0,c.width,c.height); return c; }
function flipH(src){ const c=mk(src.width,src.height), g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }

  elder:  { h:'e', b:'P', B:'p', n:'p', y:'y' },
  smith:  { h:'N', b:'n', B:'d', y:'E', S:'S' },
  inn:    { h:'o', b:'g', B:'G', y:'w' },
  kid:    { h:'y', b:'r', B:'R', y:'w' },
  guard:  { h:'N', b:'e', B:'E', y:'r' },   // guardia: pelo castaño, cota gris
  knight: { h:'w', b:'E', B:'d', y:'y' },   // Sir Galvan: canoso, armadura oscura
};
function buildSprites(){
  SPR.down  = [spr(HERO_DOWN), spr(withLegs(HERO_DOWN, LEGS_DOWN_B))];
  SPR.up    = [spr(HERO_UP),   spr(withLegs(HERO_UP, LEGS_DOWN_B))];
  SPR.right = [spr(HERO_SIDE), spr(withLegs(HERO_SIDE, LEGS_SIDE_B))];
  SPR.left  = SPR.right.map(flipH);
  for(const k in NPC_REMAP) SPR['npc_'+k] = spr(HERO_DOWN, NPC_REMAP[k]);
  SPR.slime = spr(SLIME);
  SPR.bat = spr(BAT);
  SPR.gargoyle = spr(BAT, { p:'E', P:'e', y:'r' });
  SPR.wolf = spr(WOLF);
  SPR.goblin = spr(GOBLIN);
  SPR.orc = spr(GOBLIN, { g:'#6f8f3a', R:'N', r:'n', y:'r', e:'e', w:'y' });
  SPR.skeleton = spr(SKELETON);
  SPR.dragon = spr(DRAGON);
  SPR.dragonShadow = silhouette(SPR.dragon, '#0b0a14');
  SPR.chest = spr(CHEST); SPR.chestOpen = spr(CHEST_OPEN); SPR.sign = spr(SIGN);
  for(const k of ['slime','bat','gargoyle','wolf','goblin','orc','skeleton','dragon']) SPR[k+'_w'] = silhouette(SPR[k], '#ffffff');
}

// ---------- tiles procedurales ----------
function tile(fn){ const c=mk(16,16), g=c.getContext('2d'); fn(g); return c; }
function P(g,x,y,col){ g.fillStyle=col; g.fillRect(x|0,y|0,1,1); }
function R(g,x,y,w,h,col){ g.fillStyle=col; g.fillRect(x|0,y|0,w|0,h|0); }
function shade(g,fn){ for(let y=0;y<16;y++) for(let x=0;x<16;x++){ const c=fn(x,y); if(c) P(g,x,y,c); } }

const VG = { base:'#5ab552', dark:'#3d8a3f', light:'#8fd16a' };
const FG = { base:'#3f8f45', dark:'#2b6b35', light:'#6fbf5a' };
function grassTile(seed, pal, opt={}){
  return tile(g=>{
    R(g,0,0,16,16,pal.base);
    const r=mulberry32(seed);
    if(opt.tall){
      for(let i=0;i<18;i++){ const x=(r()*15|0), y=(r()*12|0)+3; P(g,x,y,pal.dark); P(g,x,y-1,pal.dark); P(g,x,y-2,pal.light); }
    } else {
      for(let i=0;i<6;i++){ const x=(r()*13|0)+1, y=(r()*13|0)+2; P(g,x-1,y-1,pal.dark); P(g,x+1,y-1,pal.dark); P(g,x,y,pal.dark); }
    }
    for(let i=0;i<6;i++) P(g, r()*16|0, r()*16|0, pal.light);
    if(opt.flowers){
      const cols=['#e04f5f','#f4f4f4','#9e5bb8','#ef7d57'];
      for(let i=0;i<3;i++){ const x=(r()*12|0)+2, y=(r()*12|0)+2, c=cols[(r()*4)|0];
        P(g,x,y-1,c); P(g,x-1,y,c); P(g,x+1,y,c); P(g,x,y+1,c); P(g,x,y,'#ffcd75'); }
    }
  });
}
function treeTile(bg){
  return tile(g=>{
    g.drawImage(bg,0,0);
    R(g,3,14,10,2,'rgba(0,0,0,0.28)');
    R(g,6,10,4,5,'#4a2c14'); R(g,7,10,2,5,'#8b5a2b');
    shade(g,(x,y)=>{
      if(y>12) return null;
      const dx=(x-7.5)/7.6, dy=(y-6)/6.4, d=dx*dx+dy*dy;
      if(d>1) return null;
      if(d>0.78) return '#173d22';
      const l=dx+dy;
      if(l<-0.75) return '#8bd86a';
      if(l<-0.1) return ((x+y)%3===0)?'#6cc25a':'#4aa346';
      if(l<0.6) return '#2f7d39';
      return '#21602c';
    });
  });
}
function pineTile(bg, seed){
  return tile(g=>{
    g.drawImage(bg,0,0);
    R(g,3,14,10,2,'rgba(0,0,0,0.28)');
    R(g,7,12,2,4,'#4a2c14');
    const tiers=[[0,5,1,3],[3,9,2,5],[6,13,3,7]];
    for(const [y0,y1,w0,w1] of tiers){
      for(let y=y0;y<=y1;y++){
        const hw=Math.round(w0+(w1-w0)*(y-y0)/(y1-y0));
        for(let x=8-hw;x<8+hw;x++){
          let c = x<8 ? '#3f9a4a' : '#24683a';
          if(x<8 && (x*3+y+seed)%7===0) c='#6cc25a';
          if(x===8-hw || x===8+hw-1 || y===y1) c='#123a22';
          P(g,x,y,c);
        }
      }
    }
  });
}
function pathTile(seed){ return tile(g=>{ R(g,0,0,16,16,'#c9a06a'); const r=mulberry32(seed); for(let i=0;i<16;i++) P(g, r()*16|0, r()*16|0, r()<.5?'#a9804e':'#e0bf8a'); for(let i=0;i<2;i++){ const x=r()*13|0, y=r()*14|0; R(g,x,y,2,1,'#8f6a3e'); } }); }
function waterTile(f){
  return tile(g=>{
    R(g,0,0,16,16,'#2f5fc0');
    const rows=[[2,1],[6,9],[10,4],[13,12]];
    for(const [y,x0] of rows){ const x=(x0+f*2)%16; for(let i=0;i<4;i++) P(g,(x+i)%16,y,(i===0||i===3)?'#4f86de':'#9ccdf7'); }
    P(g,(5+f*3)%16,4,'#e8f6ff');
  });
}
function lavaTile(f){
  return tile(g=>{
    R(g,0,0,16,16,'#d9441c');
    const r=mulberry32(77);
    for(let i=0;i<6;i++){ const x=(r()*16|0), y=(r()*16|0); R(g,(x+f)%16,y,3,1,'#ff8a3d'); }
    for(let i=0;i<3;i++){ const x=(r()*14|0), y=(r()*14|0); R(g,(x+f*2)%15,y,2,2,'#ffcd75'); }
    for(let i=0;i<4;i++){ const x=(r()*14|0), y=(r()*14|0); R(g,(x+16-f)%15,y,2,1,'#8a2410'); }
  });
}
function bridgeTile(){ return tile(g=>{ R(g,0,0,16,16,'#a0703f'); for(let x=0;x<16;x+=4) R(g,x,0,1,16,'#6b4423'); R(g,0,2,16,1,'#c48a4f'); R(g,0,0,16,2,'#4a2c14'); R(g,0,14,16,2,'#4a2c14'); for(let x=2;x<16;x+=4) P(g,x,8,'#6b4423'); }); }
function roofTile(){
  return tile(g=>{
    R(g,0,0,16,16,'#b13e53');
    for(let y=0;y<16;y+=4){
      R(g,0,y,16,1,'#cf5a6c'); R(g,0,y+3,16,1,'#6e1f35');
      const off=(y/4)%2?2:0; for(let x=off;x<16;x+=4) R(g,x,y+1,1,2,'#8a2c42');
    }
  });
}
function houseWall(kind){
  return tile(g=>{
    R(g,0,0,16,16,'#e9dcc0');
    const r=mulberry32(5); for(let i=0;i<8;i++) P(g,2+(r()*12|0),2+(r()*12|0),'#d4c49e');
    R(g,0,0,16,2,'#5d3a1a'); R(g,0,14,16,2,'#5d3a1a'); R(g,0,0,2,16,'#5d3a1a'); R(g,14,0,2,16,'#5d3a1a');
    if(kind==='H'){ for(let i=0;i<12;i++){ P(g,2+i,2+i,'#5d3a1a'); P(g,3+i,2+i,'#5d3a1a'); } }
    if(kind==='W'){ R(g,4,4,8,8,'#5d3a1a'); R(g,5,5,6,6,'#41a6f6'); R(g,5,5,2,2,'#a8dcf5'); R(g,7,5,1,6,'#5d3a1a'); R(g,5,7,6,1,'#5d3a1a'); R(g,3,12,10,1,'#4a2c14'); }
    if(kind==='D'){ R(g,4,3,8,13,'#4a2c14'); R(g,5,4,6,12,'#7a4a24'); R(g,7,4,1,12,'#4a2c14'); R(g,9,9,1,1,'#ffcd75'); R(g,5,4,6,1,'#9a6a3a'); }
  });
}
function fenceTile(bg){
  return tile(g=>{
    g.drawImage(bg,0,0);
    R(g,0,5,16,2,'#8b5a2b'); R(g,0,10,16,2,'#8b5a2b'); R(g,0,7,16,1,'#4a2c14'); R(g,0,12,16,1,'#4a2c14');

function newMap(w,h,fill){ return Array.from({length:h},()=>Array(w).fill(fill)); }
function setT(m,x,y,c){ if(y>=0 && y<m.length && x>=0 && x<m[0].length) m[y][x]=c; }
function hline(m,y,x1,x2,c){ for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++) setT(m,x,y,c); }
function vline(m,x,y1,y2,c){ for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++) setT(m,x,y,c); }
function rectFill(m,x,y,w,h,c){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) setT(m,i,j,c); }
function house(m,x,y,w,door){ for(let i=0;i<w;i++){ setT(m,x+i,y,'R'); setT(m,x+i,y+1,'R'); setT(m,x+i,y+2, i===door?'D':(i===1||i===w-2)?'W':'H'); } }

function buildVillage(){
  const m=newMap(32,22,'.'), r=mulberry32(99);
  for(let y=0;y<22;y++) for(let x=0;x<32;x++) if(r()<0.08) m[y][x]=',';
  for(let x=0;x<32;x++){ m[0][x]='T'; m[21][x]='T'; }
  for(let y=0;y<22;y++){ m[y][0]='T'; m[y][31]='T'; }
  house(m,3,2,6,2); house(m,19,2,7,3); house(m,12,7,8,4);
  hline(m,13,1,31,':'); vline(m,5,5,13,':'); vline(m,22,5,13,':'); vline(m,16,10,13,':');
  m[12][31]='.'; m[14][31]='.';
  for(let y=16;y<21;y++) for(let x=2;x<11;x++){ const dx=(x-6)/3.2, dy=(y-18)/1.7; if(dx*dx+dy*dy<=1) m[y][x]='~'; }
  for(let y=16;y<=19;y++) for(let x=20;x<=26;x++) m[y][x] = (y===16||y===19||x===20||x===26)?'f':',';
  [[10,2],[13,3],[27,3],[28,8],[2,9],[10,9],[25,10],[11,18],[14,18],[28,18],[29,5],[2,3]].forEach(([x,y])=>m[y][x]='T');
  return m;
}
function buildForest(){
  const Wd=40, Hd=28, m=newMap(Wd,Hd,'.'), r=mulberry32(1234);
  for(let y=0;y<Hd;y++) for(let x=0;x<Wd;x++){ const v=r(); if(v<0.30) m[y][x]= r()<0.5?'T':'Y'; else if(v<0.55) m[y][x]='"'; }
  for(let x=0;x<Wd;x++){ m[0][x]='Y'; m[Hd-1][x]='Y'; }
  for(let y=0;y<Hd;y++){ m[y][0]='Y'; m[y][Wd-1]='Y'; }
  for(let y=0;y<Hd;y++){ const cx=19+Math.round(Math.sin(y*0.45)*1.5); m[y][cx]='~'; m[y][cx+1]='~'; }
  const carve=(x,y)=>{ const c=m[y][x]; m[y][x] = (c==='~'||c==='=')?'=':':'; };
  for(let x=0;x<=30;x++) carve(x,13);
  for(let y=4;y<=22;y++) carve(30,y);
  for(let x=30;x<=35;x++) carve(x,22);
  for(let x=30;x<=33;x++) carve(x,4);
  for(let y=13;y<=23;y++) carve(7,y);
  for(let x=5;x<=7;x++) carve(x,23);
  // claros
  const clear=(cx,cy,rad)=>{ for(let y=cy-rad;y<=cy+rad;y++) for(let x=cx-rad;x<=cx+rad;x++){ if(x<1||y<1||x>=Wd-1||y>=Hd-1) continue; if(m[y][x]==='T'||m[y][x]==='Y') m[y][x]='.'; } };
  clear(34,4,1); clear(4,23,1); clear(23,12,1); clear(2,13,1);
  m[12][0]=':'; m[13][0]=':'; m[14][0]=':'; m[12][1]='.'; m[14][1]='.';
  m[12][3]='.'; m[21][34]='.'; m[12][23]='.';
  rectFill(m,36,19,4,7,'X');
  m[22][37]='E'; m[22][36]= flags && flags.gate ? ':' : 'G';
  return m;
}
function buildCave(){
  const m=newMap(34,26,'X');

  room(1,9,6,7); room(10,2,9,6); room(21,9,7,6); room(10,15,10,8); room(23,16,10,9);

  hline(m,19,19,23,'c'); vline(m,25,14,16,'c');

  [[31,23],[32,23],[32,22],[23,24],[24,24],[32,16],[31,16]].forEach(([x,y])=>m[y][x]='l');

let AC=null, master=null, sfxBus=null, musBus=null, musDuck=null, noiseBuf=null, muted=false, pendingMusic=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AC=null; return; }
  master=AC.createGain(); master.gain.value = muted?0:0.6; master.connect(AC.destination);
  // Buses (audio-design): Master <- Música <- Atenuación, y Efectos. Los ajustes actúan sobre los buses.
  sfxBus=AC.createGain(); sfxBus.connect(master);
  musBus=AC.createGain(); musBus.connect(master);
  musDuck=AC.createGain(); musDuck.connect(musBus);
  applyVolumes();
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  if(pendingMusic) playMusic(pendingMusic, true);
}
const NF = m => 440*Math.pow(2,(m-69)/12);
function tone(f,dur,o={}){
  if(!AC) return; const t=AC.currentTime+(o.delay||0);
  const osc=AC.createOscillator(), g=AC.createGain(); osc.type=o.type||'square';
  osc.frequency.setValueAtTime(f,t); if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(o.vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  osc.connect(g); g.connect(sfxBus); osc.start(t); osc.stop(t+dur+0.03);
}
function noise(dur,o={}){
  if(!AC) return; const t=AC.currentTime+(o.delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.freq||2000,t); if(o.slide) f.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(o.vol||0.3,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t+dur+0.03);
}

  if(!AC || !mus.gain) return;
  const now=AC.currentTime;
  if(mus.tracks.some(t=>t.t<now-0.3)) mus.tracks.forEach(t=>{ t.i=0; t.t=now+0.05; });
  for(const tr of mus.tracks){
    while(tr.t < now+0.25){
      const [m,d]=tr.notes[tr.i], dur=d*mus.spu;
      if(m>0){
        const o=AC.createOscillator(), g=AC.createGain(); o.type=tr.wave; o.frequency.value=NF(m);
        g.gain.setValueAtTime(0.0001,tr.t); g.gain.linearRampToValueAtTime(tr.vol,tr.t+0.012);
        g.gain.setValueAtTime(tr.vol,tr.t+dur*0.65); g.gain.linearRampToValueAtTime(0.0001,tr.t+dur*0.95);
        o.connect(g); g.connect(mus.gain); o.start(tr.t); o.stop(tr.t+dur);
      }

    }
  }
}

const padHeld = {}, padRep = {};
function deadzone(x,y,dead=0.25){ const m=Math.hypot(x,y); if(m<=dead) return [0,0]; const k=Math.min((m-dead)/(1-dead),1); return [x/m*k, y/m*k]; }

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];

  const b = i => !!(gp && gp.buttons[i] && gp.buttons[i].pressed);
  const [sx,sy] = gp ? deadzone(gp.axes[0]||0, gp.axes[1]||0) : [0,0];
  const now = { up:b(12)||sy<-0.5, down:b(13)||sy>0.5, left:b(14)||sx<-0.5, right:b(15)||sx>0.5, ok:b(0), cancel:b(1)||b(8)||b(9) };
  for(const a in now){
    if(now[a] && !padHeld[a]){ pressed[a]=true; bufferPress(a); padRep[a]=0; }

// ---------- guardado (save-systems) ----------
// Se guardan datos planos (identificadores, números y banderas) con un número de versión; el mundo se
// reconstruye a partir de ellos. Cada escritura conserva la anterior como copia ".bak": si la principal
// se corrompe, se carga la copia. Hay un hueco manual y otro de autoguardado que nunca se pisan.
const SAVE_VERSION = 2;
const AUTO_KEY = 'cronicas-valdoria-auto';
let lastAutosave = -99999, titleSave = null;
function captureState(){
  return { version:SAVE_VERSION, savedAt:Date.now(), hero:JSON.parse(JSON.stringify(hero)), flags:JSON.parse(JSON.stringify(flags)),
    map:map.id, x:pl.x, y:pl.y, dir:pl.dir, time:playFrames };
}
function writeSlot(key, data){
  try {
    const str=JSON.stringify(data), prev=localStorage.getItem(key);
    localStorage.setItem(key+'.tmp', str);
    JSON.parse(localStorage.getItem(key+'.tmp'));          // comprobar que lo escrito se puede leer
    if(prev) localStorage.setItem(key+'.bak', prev);       // conservar la última partida buena
    localStorage.setItem(key, str); localStorage.removeItem(key+'.tmp');
    return true;
  } catch(e){ return false; }
}
// Migraciones en orden (v -> v+1). Nunca se borran: dejarían huérfanas las partidas de esa versión.
const MIGRATIONS = {
  1: d => { d.savedAt=d.savedAt||0; d.flags=d.flags||{}; d.flags.chests=d.flags.chests||{};
            d.hero.items=Object.assign({pocion:0,eter:0}, d.hero.items); return d; },   // la v1 no tenía versión
};
function migrate(d){
  let v = Number.isInteger(d.version) ? d.version : 1;
  if(v>SAVE_VERSION) throw new Error('newer');                // partida de una versión más nueva: no tocarla
  while(v<SAVE_VERSION){ d=MIGRATIONS[v](d); v++; d.version=v; }
  return d;
}
function validSave(d){
  const h=d && d.hero;
  return !!(h && Number.isInteger(h.lv) && h.lv>=1 && h.base && typeof h.hp==='number' && typeof h.gold==='number'
    && WEAPONS[h.weapon] && ARMORS[h.armor] && h.items && MAPS[d.map] && Number.isInteger(d.x) && Number.isInteger(d.y)
    && d.flags && typeof d.flags==='object');
}
function readSlot(key){
  for(const k of [key, key+'.bak']){
    let raw=null;
    try { raw=localStorage.getItem(k); } catch(e){ return { error:'blocked' }; }
    if(!raw) continue;
    try { const d=migrate(JSON.parse(raw)); if(validSave(d)) return { data:d, backup:k!==key }; }
    catch(e){ if(e.message==='newer') return { error:'newer' }; }
  }
  return null;
}
function newestSave(){
  const found=[readSlot(SAVE_KEY), readSlot(AUTO_KEY)].filter(Boolean);
  const ok=found.filter(x=>x.data).sort((a,b)=>(b.data.savedAt||0)-(a.data.savedAt||0));
  return ok[0] || found[0] || null;
}
function saveGame(){ const r=writeSlot(SAVE_KEY, captureState()); if(r) saveIcon=60; return r; }
function autosave(force){
  if(!force && frame-lastAutosave<300) return;                // como mucho una vez cada 5 s
  if(writeSlot(AUTO_KEY, captureState())){ lastAutosave=frame; saveIcon=60; }
}

// Variables que el diálogo puede leer. Las banderas se pueden escribir con "set"; oro y nivel son de solo lectura.
const DLG_FLAGS = ['metElder','key','gate','boss','galvan'];
function dlgVars(){ const v={ gold:hero?hero.gold:0, lv:hero?hero.lv:1 }; for(const f of DLG_FLAGS) v[f]=!!(flags&&flags[f]); return v; }
const DLG_CMDS = {
  gold: n => { hero.gold+=(+n); SFX.coin(); },
  item: (k,n) => { hero.items[k]+=(+n); SFX.chest(); },
  roar: () => { SFX.roar(); addTrauma(0.7); },
  fight: id => encounter(id, true),
};
function evalExpr(src, vars){
  if(src===undefined || src==='') return true;
  const toks = src.match(/>=|<=|==|!=|[<>()]|\d+|[A-Za-z_]\w*|\S/g) || [];
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  const orE=()=>{ let v=andE(); while(peek()==='or'){ next(); const r=andE(); v=v||r; } return v; };
  const andE=()=>{ let v=notE(); while(peek()==='and'){ next(); const r=notE(); v=v&&r; } return v; };
  const notE=()=>{ if(peek()==='not'){ next(); return !notE(); } return cmpE(); };
  const cmpE=()=>{ let v=atom(); const o=peek();
    if(['==','!=','<','<=','>','>='].includes(o)){ next(); const r=atom();
      v = o==='=='?v===r : o==='!='?v!==r : o==='<'?v<r : o==='<='?v<=r : o==='>'?v>r : v>=r; }
    return v; };
  const atom=()=>{ const t=next();
    if(t===undefined) throw new Error('fin inesperado');
    if(t==='('){ const v=orE(); if(next()!==')') throw new Error('falta )'); return v; }
    if(/^\d+$/.test(t)) return +t;
    if(t==='true') return true; if(t==='false') return false;
    if(!/^[A-Za-z_]\w*$/.test(t) || !(t in vars)) throw new Error('desconocido: '+t);
    return vars[t]; };
  const v=orE(); if(i!==toks.length) throw new Error('sobra: '+toks.slice(i).join(' '));
  return v;
}
async function runDialogue(id){
  const g=DIALOGUES[id]; let nid=g.start;
  for(let guard=0; nid && guard<200; guard++){
    const n=g.nodes[nid];
    for(const k in (n.set||{})) flags[k]=n.set[k];
    for(const c of (n.cmd||[])){ const [name,...args]=c.split(' '); await DLG_CMDS[name](...args); if(scene!=='world') return; }
    if(n.end) return;
    const speaker = n.speaker!==undefined ? n.speaker : g.speaker, o = speaker ? {name:speaker} : {};
    if(n.choices){
      const shown=n.choices.filter(c=>evalExpr(c.if, dlgVars()));
      const r=await ask(n.line?LINES[n.line]:'', shown.map(c=>LINES[c.text]), o);
      const ch=shown[r<0 ? shown.length-1 : r];             // cancelar = la última opción (despedirse)
      for(const k in (ch.set||{})) flags[k]=ch.set[k];      // lo que cuesta una elección se paga al elegir
      nid=ch.to; continue;
    }
    if(n.line) await say(LINES[n.line], o);
    if(n.branch){ nid=n.branch.find(b=>evalExpr(b.if, dlgVars())).to; continue; }
    nid=n.next;
  }
}
// Validación: destinos que existen, una sola salida por nodo, textos y comandos conocidos, expresiones
// que solo usan variables declaradas, nodos alcanzables y una salida incondicional en ramas y elecciones.
function validateDialogues(){
  const problems=[], vars=dlgVars();
  for(const [id,g] of Object.entries(DIALOGUES)){
    const P=m=>problems.push(id+'.'+m);
    const targets=n=>[n.next, ...(n.choices||[]).map(c=>c.to), ...(n.branch||[]).map(b=>b.to)].filter(Boolean);
    const expr=(nid,e)=>{ if(e===undefined) return; try{ evalExpr(e,vars); } catch(err){ P(nid+': "'+e+'" '+err.message); } };
    if(!g.nodes[g.start]) P('start no existe');
    const seen=new Set(), stack=[g.start];
    while(stack.length){ const n=stack.pop(); if(seen.has(n) || !g.nodes[n]) continue; seen.add(n); stack.push(...targets(g.nodes[n])); }
    for(const [nid,n] of Object.entries(g.nodes)){
      if(!seen.has(nid)) P(nid+': inalcanzable');
      const exits=['next','choices','branch','end'].filter(k=>n[k]!==undefined);
      if(exits.length!==1) P(nid+': necesita exactamente una salida');
      for(const t of targets(n)) if(!g.nodes[t]) P(nid+': destino '+t+' no existe');
      if(n.line && !(n.line in LINES)) P(nid+': falta el texto '+n.line);
      for(const c of (n.choices||[])){ if(!(c.text in LINES)) P(nid+': falta el texto '+c.text); expr(nid,c.if); }
      if(n.choices && n.choices[n.choices.length-1].if) P(nid+': la última elección debe estar siempre visible');
      for(const b of (n.branch||[])) expr(nid,b.if);
      if(n.branch && n.branch[n.branch.length-1].if) P(nid+': la última rama debe ser incondicional');
      for(const k in (n.set||{})) if(!DLG_FLAGS.includes(k)) P(nid+': escribe una variable no declarada '+k);
      for(const c of (n.cmd||[])) if(!DLG_CMDS[c.split(' ')[0]]) P(nid+': comando desconocido '+c);
    }
  }
  return problems;
}

async function forge(){
  const o={name:'Bruna'};
  await say('¡Bienvenido a la forja! Acero de Robledal, el mejor de todo Valdoria.',o);
  let i=0;
  while(true){
    const goods=[ ...['corta','larga','hacha'].map(k=>({t:'w',k,it:WEAPONS[k]})), ...['cuero','malla','placas'].map(k=>({t:'a',k,it:ARMORS[k]})) ];
    const d=new Dialog('Tienes '+hero.gold+' monedas. ¿Qué te llevas?',{...o,hold:true}); await openModal(d);
    const c=await choose(goods.map(g=>{ const owned=(g.t==='w'?hero.weapon:hero.armor)===g.k; return { label:g.it.name, right:owned?'Equipado':g.it.price+' G', disabled:owned }; }),
      { x:8, y:8, w:228, start:i, info:j=>{ const g=goods[j]; if(g.t==='w') return 'Ataque +'+g.it.atk+' (ahora +'+WEAPONS[hero.weapon].atk+')'; return 'Defensa +'+g.it.def+' (ahora +'+ARMORS[hero.armor].def+')'; }, infoBox:{x:8,y:96,w:228,h:40} });
    closeModal(d);
    if(c<0){ await say('¡Vuelve cuando quieras! Y no dejes que ese dragón te chamusque.',o); return; }
    i=c; const g=goods[c];
    if(hero.gold<g.it.price){ SFX.buzz(); await say('No te alcanza el oro, muchacho. Vuelve cuando tengas '+g.it.price+' monedas.',o); continue; }
    const worse = g.t==='w' ? g.it.atk<WEAPONS[hero.weapon].atk : g.it.def<ARMORS[hero.armor].def;
    const r=await ask((worse?'Eso es peor que lo que llevas. ':'')+'¿Comprar '+g.it.name+' por '+g.it.price+' monedas?',['Sí','No'],o);
    if(r!==0) continue;
    hero.gold-=g.it.price; if(g.t==='w') hero.weapon=g.k; else hero.armor=g.k; SFX.coin();
    await say('¡Te equipas '+g.it.name+'!',o);
  }
}
async function inn(){
  const o={name:'Marta'};
  let i=0;
  while(true){
    const d=new Dialog('Posada El Roble Dormido. ¿Qué deseas, viajero?',{...o,hold:true}); await openModal(d);
    const c=await choose([{label:'Descansar',right:'10 G'},{label:'Comprar'},{label:'Guardar'},{label:'Salir'}],{aboveDialog:true,start:i,w:150});
    closeModal(d);
    if(c<0||c===3){ await say('¡Buen viaje, y que la luz te guíe!',o); return; }
    i=c;
    if(c===0){
      if(hero.gold<10){ SFX.buzz(); await say('Lo siento, la habitación cuesta 10 monedas.',o); continue; }
      hero.gold-=10;
      await transition('fade',()=>{ hero.hp=HS.maxhp(); hero.mp=HS.maxmp(); SFX.rest(); },40);
      autosave(true);
      await say('Duermes profundamente... ¡PV y PM restaurados!');
    } else if(c===1){
      let j=0;
      while(true){
        const keys=['pocion','eter'];
        const d2=new Dialog('Tienes '+hero.gold+' monedas.',{...o,hold:true}); await openModal(d2);
        const s=await choose(keys.map(k=>({label:ITEMS[k].name+' x'+hero.items[k], right:ITEMS[k].price+' G'})),{x:8,y:8,w:200,start:j,info:q=>ITEMS[keys[q]].desc,infoBox:{x:8,y:48,w:200,h:28}});
        closeModal(d2);
        if(s<0) break;
        j=s; const it=ITEMS[keys[s]];
        if(hero.gold<it.price){ SFX.buzz(); await say('No tienes suficiente oro.',o); continue; }
        hero.gold-=it.price; hero.items[keys[s]]++; SFX.coin();
      }
    } else if(c===2){
      await say(saveGame()?'Partida guardada. ¡Tu leyenda queda escrita!':'No se pudo guardar: el navegador bloquea el almacenamiento.',o);
    }
  }
}

  if(flags.chests[en.id]){ await say('El cofre está vacío.'); return; }
  flags.chests[en.id]=true; SFX.chest(); feedback('small', en.x*TS+8, en.y*TS+6); sparks(en.x*TS+8, en.y*TS+6, 14, false, ['#ffcd75','#fff3b0']);
  const g=en.give;
  if(g.key){ flags.key=true; await say('¡Has encontrado la Llave de Hierro! Abre la reja de la Cueva de Ceniza.'); await questReward('key'); }
  else if(g.item){ hero.items[g.item]+=g.n; await say('¡Has encontrado '+g.n+' '+(g.n>1?ITEMS[g.item].plural:ITEMS[g.item].name)+'!'); }
  else if(g.gold){ hero.gold+=g.gold; await say('¡Has encontrado '+g.gold+' monedas de oro!'); }
  else if(g.weapon){ hero.weapon=g.weapon; await say('¡Has encontrado el Colmillo de Alba, la espada legendaria! (Ataque +24) Su hoja brilla como el amanecer. Te la equipas al instante.'); }
}
async function interact(){
  const [dx,dy]=DIRS[pl.dir], fx=pl.x+dx, fy=pl.y+dy;
  const en=entAt(fx,fy);
  if(en){
    if(en.type==='npc' || en.type==='boss') return en.talk();
    if(en.type==='chest') return openChest(en);
    if(en.type==='sign') return say(en.text);
  }
  if(tileAt(fx,fy)==='G'){
    if(flags.key){ SFX.gate(); feedback('medium', fx*TS+8, fy*TS+8); flags.gate=true; grid[fy][fx]=':'; await say('Metes la Llave de Hierro en la cerradura... ¡La reja se abre con un chirrido!'); await questReward('gate'); }
    else await say('Una reja de hierro oxidada bloquea la entrada de la cueva. Está cerrada con llave.');
  }
}
async function pauseMenu(){
  SFX.ok(); let i=0;
  while(true){
    const c=await choose(['Estado','Diario','Objetos','Opciones','Guardar','Cerrar'],{x:200,y:8,w:112,start:i});
    if(c<0||c===5) return;
    i=c;
    if(c===0) await openModal(new StatusPanel());
    else if(c===1) await openModal(new JournalPanel());
    else if(c===2) await worldItems();
    else if(c===3) await optionsMenu();
    else if(c===4) await say(saveGame()?'Partida guardada.':'No se pudo guardar: el navegador bloquea el almacenamiento.');
  }
}
// Opciones (game-ui-ux + game-feel): volumen por bus, temblor y destellos regulables, velocidad del texto.
async function optionsMenu(){
  const STEPS=[0,0.25,0.5,0.75,1], pct=v=>Math.round(v*100)+'%';
  const next=v=>{ const i=STEPS.indexOf(v); return STEPS[(i+1)%STEPS.length]; };
  const TEXT=[0.6,1,2], tname=v=>v<1?'Lento':v>1?'Rápido':'Normal';
  const info=['Volumen de la música.','Volumen de los efectos de sonido.','Temblor de pantalla en los golpes. 0% lo quita.',
    'Destellos en golpes fuertes y rayos. "No" usa un tinte suave.','Velocidad a la que aparece el texto.','Guardar los ajustes y volver.'];
  let i=0;
  while(true){
    const items=[{label:'Música',right:pct(settings.music)},{label:'Efectos',right:pct(settings.sfx)},{label:'Temblor',right:pct(settings.shake)},
      {label:'Destellos',right:settings.flash?'Sí':'No'},{label:'Texto',right:tname(settings.text)},{label:'Volver'}];
    const c=await choose(items,{x:66,y:20,w:188,start:i,info:j=>info[j],infoBox:{x:66,y:112,w:188,h:64}});
    if(c<0 || c===5){ saveSettings(); return; }
    i=c;
    if(c===0) settings.music=next(settings.music);
    if(c===1){ settings.sfx=next(settings.sfx); }
    if(c===2){ settings.shake=next(settings.shake); addTrauma(0.5); }
    if(c===3) settings.flash=!settings.flash;
    if(c===4) settings.text=TEXT[(TEXT.indexOf(settings.text)+1)%TEXT.length];
    applyVolumes(); saveSettings();
  }
}
// Diario de misiones (rpg): el objetivo sale de las banderas guardadas, así no se rompe al cargar.
function questLog(){
  if(!flags.metElder) return ['Habla con el Anciano Eldric. Vive en la casa del noroeste de Robledal.'];
  if(!flags.key) return ['Busca la Llave de Hierro en un cofre al noreste del Bosque Umbrío.','Pista: cruza el puente y sigue el camino hacia el norte.'];
  if(!flags.gate) return ['Abre la reja de la Cueva de Ceniza, al sureste del bosque.','Pista: ponte frente a la reja y pulsa Z.'];
  if(!flags.boss) return ['Derrota al dragón Ignaroth, en lo más hondo de la Cueva de Ceniza.','Pista: el fuego apenas le hace daño; el Rayo (nivel 5) sí.'];
  return ['¡Has salvado Valdoria! Puedes seguir explorando libremente.'];
}
class JournalPanel {
  update(){ if(pressed.ok||pressed.cancel){ pressed.ok=pressed.cancel=false; SFX.cancel(); closeModal(this); } }
  draw(){
    const x=20,y=24,w=280,h=150; box(x,y,w,h);
    txt('Diario de misiones',x+w/2,y+10,'#ffcd75','center');
    let ly=y+30;
    questLog().forEach((t,i)=>{ wrap(t,32).forEach(l=>{ txt(l,x+12,ly,i?'#94b0c2':'#f4f4f4'); ly+=12; }); ly+=6; });
    const opened=Object.keys(flags.chests).length, total=5;
    txt('Cofres abiertos: '+opened+'/'+total, x+12, y+h-22, '#c9a25a');
  }
}
// rpg: la experiencia no sale solo de los combates; cumplir objetivos también da PX para no obligar a "farmear".
const QUEST_XP = { key:30, gate:40 };
async function questReward(kind){
  const n=QUEST_XP[kind];
  await say('¡Objetivo cumplido! Ganas '+n+' PX.');
  await gainXp(n, t=>say(t));
}

async function worldItems(){
  const keys=['pocion','eter'];
  const list=keys.map(k=>({label:ITEMS[k].name, right:'x'+hero.items[k], disabled:hero.items[k]<=0}));
  if(flags.key) list.push({label:'Llave de Hierro', disabled:true});
  const c=await choose(list,{x:96,y:8,w:200,info:j=>j<2?ITEMS[keys[j]].desc:'Abre la reja de la Cueva de Ceniza.',infoBox:{x:96,y:8+list.length*12+16,w:200,h:28}});
  if(c<0||c>=2) return;
  const k=keys[c];
  if(k==='pocion'){ if(hero.hp>=HS.maxhp()){ await say('Tu salud ya está completa.'); return; } const n=Math.min(40,HS.maxhp()-hero.hp); hero.hp+=n; hero.items.pocion--; SFX.heal(); await say('Bebes una Poción. Recuperas '+n+' PV.'); }
  else { if(hero.mp>=HS.maxmp()){ await say('Tu magia ya está completa.'); return; } const n=Math.min(15,HS.maxmp()-hero.mp); hero.mp+=n; hero.items.eter--; SFX.heal(); await say('Bebes un Elixir. Recuperas '+n+' PM.'); }
}
async function warpTo(w){
  const ty = w.ty===null ? pl.y : w.ty;
  await transition('fade',()=>loadMap(w.to,w.tx,ty,w.dir),14);
  autosave(true);                          // cambio de zona: un punto seguro para autoguardar
}

const KN = { img:null, white:null, ready:false };
const ENEMY_X = 205, KNIGHT_X = 72, FEET_Y = 134, KS = 2;   // posiciones en combate (escala 2)
function loadKnight(){
  return new Promise(res=>{
    if(!KNIGHT) return res();
    const im=new Image();
    im.onload=()=>{ KN.img=im; const c=mk(im.width,im.height); c.getContext('2d').drawImage(im,0,0); KN.white=silhouette(c,'#ffffff'); KN.ready=true; res(); };
    im.onerror=()=>res(); im.src=KNIGHT.src;
  });
}
// Reproductor de clips: cada fotograma dura sus milisegundos; los clips de una sola vez avisan al terminar
// y vuelven al reposo. at(n) espera a un fotograma concreto (por ejemplo el del golpe) para aplicar el daño.
class KnightAnim {
  constructor(){ this.x=0; this.flip=false; this.hurt=0; this.kb=0; this.set('idle'); }
  set(name, opts={}){ if(this.waiters) this.waiters.forEach(w=>w.r());   // nunca deja una espera colgada
    this.clip=name; this.i=0; this.acc=0; this.opts=opts; this.done=false; this.waiters=[]; }
  play(name, opts={}){
    if(!KNIGHT) return Promise.resolve();
    const prev=this.onDone; this.onDone=null; if(prev) prev();
    this.set(name,opts); if(opts.flip!==undefined) this.flip=opts.flip;
    return new Promise(r=>{ if(KNIGHT.clips[name].loop) r(); else this.onDone=r; });
  }
  at(n){ return new Promise(r=>{ if(this.i>=n || this.done) r(); else this.waiters.push({n,r}); }); }
  moveTo(x, clip, speed, restFlip=false){
    if(!KNIGHT){ this.x=x; return Promise.resolve(); }
    this.tx=x; this.speed=speed; this.moving=true; this.restFlip=restFlip;
    this.play(clip,{flip:x<this.x});
    return new Promise(r=>{ this.moveDone=r; });
  }
  update(ms){
    if(!KNIGHT) return;
    if(this.hurt>0) this.hurt--; this.kb*=0.8; if(this.kb<0.3) this.kb=0;
    if(this.moving){
      const d=this.tx-this.x; this.x+=Math.sign(d)*Math.min(Math.abs(d),this.speed);
      if(Math.abs(this.tx-this.x)<0.5){ this.x=this.tx; this.moving=false; this.play('idle',{flip:this.restFlip}); const r=this.moveDone; this.moveDone=null; if(r) r(); }
    }
    if(this.done) return;
    const c=KNIGHT.clips[this.clip];
    this.acc+=ms;
    while(this.acc>=c.dur[this.i]){
      if(this.opts.holdAt!==undefined && this.i>=this.opts.holdAt){ this.acc=0; break; }
      this.acc-=c.dur[this.i]; this.i++;
      if(this.i>=c.n){
        if(c.loop) this.i=0;
        else { this.i=c.n-1; this.done=true; const r=this.onDone; this.onDone=null; if(!this.opts.hold) this.set('idle'); if(r) r(); break; }
      }
      const ready=this.waiters.filter(w=>this.i>=w.n); this.waiters=this.waiters.filter(w=>this.i<w.n); ready.forEach(w=>w.r());
    }
  }
  draw(feetY, scale, alpha=1){
    if(!KN.ready) return;
    const c=KNIGHT.clips[this.clip], S=KNIGHT.size, ax=KNIGHT.anchor[0], w=S*scale;
    const x=this.x-this.kb*(this.flip?-1:1);
    const dx=Math.round(this.flip ? x-(S-ax)*scale : x-ax*scale), dy=Math.round(feetY-S*scale);
    const img=(this.hurt>0 && this.hurt%4<2) ? KN.white : KN.img;
    ctx.save(); ctx.globalAlpha=alpha;
    if(this.flip){ ctx.translate(dx+w,dy); ctx.scale(-1,1); ctx.drawImage(img,this.i*S,c.row*S,S,S,0,0,w,w); }
    else ctx.drawImage(img,this.i*S,c.row*S,S,S,dx,dy,w,w);
    ctx.restore();
  }
}

function pickEnemy(){
  let table;
  if(map.id==='forest') table = pl.x>20 ? [['bat',2],['wolf',4],['goblin',4],['slime',1]] : [['slime',5],['bat',3],['wolf',2],['goblin',1]];
  else table = pl.x>20 ? [['skeleton',3],['gargoyle',3],['orc',4]] : [['skeleton',5],['gargoyle',3],['orc',2]];
  let tot=table.reduce((a,b)=>a+b[1],0), r=Math.random()*tot;
  for(const [k,w] of table){ if((r-=w)<0) return k; }
  return table[0][0];
}
function setupBattle(id,boss){
  knight.x=-30; knight.flip=false; knight.hurt=0; knight.kb=0; knight.moving=false; knight.play('idle');

  battle = { enemy:{...d, id, maxhp:d.hp, hp:d.hp, flash:0, lunge:0, dying:-1, turn:0, stolen:0, enraged:false},

function addFx(type){

  if(type==='bolt'){ const pts=[]; let x=eb.cx+rnd(40)-20; for(let y=0;y<=eb.cy;y+=12){ pts.push([x,y]); x+=rnd(17)-8; } pts.push([eb.cx,eb.cy]); B.fx.push({type,t:0,dur:20,pts}); }

async function playerCommand(){
  const B=battle;
  const cmdInfo=['Corre hacia el enemigo y lo golpea con la espada.','Dispara una flecha: hace menos daño, pero atraviesa armaduras.','Lanza un hechizo gastando PM.','Usa un objeto de tu bolsa.','Intenta escapar del combate.'];
  while(true){
    const c=await choose(['Atacar','Arco','Magia','Objetos','Huir'],{x:6,y:164,w:96,cancel:false,start:B.lastCmd,info:i=>(i===0?'¿Qué hará '+hero.name+'? ':'')+cmdInfo[i],infoBox:{x:106,y:164,w:208,h:70}});
    B.lastCmd=c;
    if(c===0) return {type:'attack'};
    if(c===1) return {type:'shoot'};
    if(c===2){
      const list=knownSpells();
      const s=await choose(list.map(k=>({label:SPELLS[k].name,right:SPELLS[k].mp+'PM',disabled:hero.mp<SPELLS[k].mp})),{x:6,y:164,w:150,info:i=>SPELLS[list[i]].desc+' Tienes '+hero.mp+' PM.',infoBox:{x:160,y:164,w:154,h:70}});
      if(s>=0) return {type:'spell',id:list[s]};
      continue;
    }
    if(c===3){
      const keys=['pocion','eter'].filter(k=>hero.items[k]>0);
      if(!keys.length){ await bsay('¡No te quedan objetos!',40); continue; }
      const s=await choose(keys.map(k=>({label:ITEMS[k].name,right:'x'+hero.items[k]})),{x:6,y:164,w:150,info:i=>ITEMS[keys[i]].desc,infoBox:{x:160,y:164,w:154,h:70}});
      if(s>=0) return {type:'item',id:keys[s]};
      continue;
    }
    return {type:'flee'};
  }
}
async function heroAct(act){
  const B=battle, e=B.enemy;
  if(act.type==='attack'){
    await bsay(hero.name+' ataca.',16);
    const eb=enemyBox();
    await knight.moveTo(Math.round(eb.cx-eb.w/2-34),'run',4);          // corre hacia el enemigo
    const anim=knight.play('attack'); SFX.swing();
    await knight.at(KNIGHT ? KNIGHT.clips.attack.events.hit : 0);       // el daño cae en el fotograma del tajo
    addFx('slash');
    const crit=Math.random()<0.07;
    await hurtEnemy(dmgCalc(HS.atk(),e.def,crit?1.8:1),crit);
    await anim;
    if(e.hp>0) await knight.moveTo(KNIGHT_X,'walk',2.5);               // vuelve a su sitio caminando
    if(crit && e.hp>0) await bsay('¡Golpe crítico!',25);
  } else if(act.type==='shoot'){
    await bsay(hero.name+' tensa el arco.',16);
    const anim=knight.play('shoot');
    await knight.at(KNIGHT ? KNIGHT.clips.shoot.events.release : 0);
    tone(320,0.12,{type:'triangle',vol:0.2,slide:180}); noise(0.1,{vol:0.15,freq:5000,type:'highpass'});
    const eb=enemyBox();
    battle.fx.push({type:'arrow', t:0, dur:12, x0:knight.x+52, x1:eb.cx-eb.w*0.25, y:FEET_Y-42});
    await wait(12);
    const crit=Math.random()<0.1;
    await hurtEnemy(dmgCalc(HS.atk()*0.8,e.def*0.4,crit?1.8:1),crit);   // la flecha ignora buena parte de la armadura
    await anim;
    if(crit && e.hp>0) await bsay('¡Flecha certera!',25);
  } else if(act.type==='spell'){
    const sp=SPELLS[act.id]; hero.mp-=sp.mp;
    await bsay(hero.name+' invoca '+sp.name+'.',16);
    knight.play('cast'); SFX.blip();
    await knight.at(KNIGHT ? KNIGHT.clips.cast.events.release : 0);     // el hechizo sale cuando baja la espada
    if(act.id==='fuego'){
      addFx('fire'); SFX.fire(); await wait(32);
      let d=dmgCalc(HS.mag()*1.5,e.def*0.5); if(e.fireRes) d=Math.max(1,Math.round(d*e.fireRes));
      await hurtEnemy(d,false);
      if(e.fireRes && e.hp>0) await bsay('Ignaroth apenas siente las llamas...',35);
    } else if(act.id==='rayo'){
      addFx('bolt'); flashWhite(6); SFX.thunder(); await wait(22);
      await hurtEnemy(dmgCalc(HS.mag()*2.4,e.def*0.25),false);
    } else if(act.id==='curar'){
      addFx('heal'); SFX.heal();
      const n=Math.min(HS.maxhp()-hero.hp, Math.round(HS.mag()*2.2+14)); hero.hp+=n;
      popup(52,74,'+'+n,'#7cff8a'); await wait(28);
      await bsay('Recuperas '+n+' PV.',30);
    }
  } else if(act.type==='item'){
    knight.play('crouch'); await knight.at(4);                         // se arrodilla para beber
    hero.items[act.id]--; SFX.heal(); addFx('heal');
    if(act.id==='pocion'){ const n=Math.min(40,HS.maxhp()-hero.hp); hero.hp+=n; popup(52,74,'+'+n,'#7cff8a'); await bsay(hero.name+' bebe una Poción. Recupera '+n+' PV.',35); }
    else { const n=Math.min(15,HS.maxmp()-hero.mp); hero.mp+=n; popup(52,74,'+'+n,'#73c8ff'); await bsay(hero.name+' bebe un Elixir. Recupera '+n+' PM.',35); }
  } else if(act.type==='flee'){
    await bsay(hero.name+' intenta huir...',18);
    if(B.boss){ await bsay('¡No hay escapatoria en la guarida del dragón!',40); return; }
    const ch=clamp(0.55+(HS.spd()-e.spd)*0.05,0.25,0.95);
    if(Math.random()<ch){ SFX.flee(); await knight.moveTo(-40,'run',5); await bsay('¡Escapas a salvo!',30); return 'fled'; }
    await knight.moveTo(30,'run',4);
    await bsay('¡No logras escapar!',30);
    await knight.moveTo(KNIGHT_X,'walk',2.5);
  }
}
async function enemyAttack(){
  const e=battle.enemy; e.turn++;
  let mult=1, msg=cap(theName(e))+' ataca.', drain=false;
  switch(e.id){
    case 'slime': if(Math.random()<.3) msg='El Limo salta sobre ti.'; break;
    case 'bat': if(Math.random()<.3){ msg='El Murciélago te muerde y bebe tu sangre.'; drain=true; } break;
    case 'wolf': if(Math.random()<.25){ msg='¡El Lobo se lanza a tu cuello!'; mult=1.4; } break;
    case 'goblin':
      if(Math.random()<.22 && hero.gold>0){ const st=Math.min(hero.gold,4+rnd(8)); hero.gold-=st; e.stolen+=st; e.lunge=14; SFX.steal(); await bsay('¡El Trasgo te roba '+st+' monedas de oro!',40); return; }
      break;
    case 'skeleton': if(Math.random()<.25){ msg='¡El Esqueleto blande su espada oxidada!'; mult=1.3; } break;
    case 'gargoyle': if(Math.random()<.25){ msg='La Gárgola cae en picado desde el techo.'; mult=1.35; } break;
    case 'orc': if(Math.random()<.25){ msg='¡El Orco descarga un golpe brutal!'; mult=1.6; } break;
    case 'dragon':
      if(e.turn%3===0){
        await bsay('Ignaroth toma aire... ¡y escupe un torrente de fuego!',35);
        addFx('breath'); SFX.breath(); e.lunge=14; await wait(38);
        await hurtHero(dmgCalc(e.atk*1.5, HS.def()*0.5)); return;
      }
      if(Math.random()<.5) msg='Ignaroth te desgarra con sus garras.'; else { msg='Ignaroth barre el suelo con su cola.'; mult=1.2; }
      break;
  }
  await bsay(msg,22);
  e.lunge=14; SFX.swing2();
  const dodge=clamp(0.04+(HS.spd()-e.spd)*0.01,0.02,0.15);            // a veces el caballero salta y esquiva
  if(Math.random()<dodge){ knight.play('jump'); await wait(30); await bsay('¡'+hero.name+' salta y esquiva el golpe!',30); return; }
  await wait(10);
  const dmg=dmgCalc(e.atk,HS.def(),mult);
  await hurtHero(dmg);
  if(drain && hero.hp>0){ const hgain=Math.min(e.maxhp-e.hp,Math.round(dmg/2)); e.hp+=hgain; }
}
async function enemyTurn(){
  const e=battle.enemy;
  if(e.id==='dragon' && !e.enraged && e.hp<e.maxhp/2){ e.enraged=true; SFX.roar(); addTrauma(1); await bsay('¡Ignaroth ruge de furia! Sus ojos arden como brasas y ahora puede atacar dos veces.',45); }
  const times = e.enraged && Math.random()<0.35 ? 2 : 1;
  for(let i=0;i<times;i++){ await enemyAttack(); if(hero.hp<=0) return; }
}
async function gainXp(n, out=bsay){
  hero.xp+=n;
  while(hero.xp>=xpNeed(hero.lv)){
    hero.xp-=xpNeed(hero.lv); hero.lv++;
    for(const k in GROW) hero.base[k]+=GROW[k];
    hero.hp+=GROW.hp; hero.mp+=GROW.mp; SFX.levelup();
    const gold=['#ffcd75','#fff3b0','#ffffff'];
    if(scene==='battle'){ addFx('levelup'); addTrauma(0.3); } else sparks(pl.x*TS+8, pl.y*TS+4, 24, true, gold);
    await out('¡'+hero.name+' sube al nivel '+hero.lv+'!\nPV +9  PM +3  Ataque +2\nDefensa +1  Magia +2',90);
    for(const k in SPELLS) if(SPELLS[k].lv===hero.lv){ SFX.heal(); await out('¡Has aprendido el hechizo '+SPELLS[k].name+'!',70); }
  }
}
async function battleLoop(){
  const B=battle, e=B.enemy;
  const walkIn=knight.moveTo(KNIGHT_X,'walk',2);                         // entra caminando al combate
  await bsay(B.boss ? '¡Ignaroth, el Dragón de Ceniza, despliega sus alas!' : '¡Aparece '+e.art+' '+e.name+'!', 50);
  await walkIn;
  while(true){
    const act=await playerCommand();
    const quick = act.type==='item' || act.type==='flee';
    const heroFirst = quick || (HS.spd()+rnd(4) >= e.spd+rnd(4));
    for(const who of (heroFirst?['h','e']:['e','h'])){
      if(who==='h'){
        const r=await heroAct(act);
        if(r==='fled') return 'fled';
        if(e.hp<=0){ await victory(); return 'win'; }
      } else {
        await enemyTurn();
        if(hero.hp<=0){ knight.play('crouch',{hold:true, holdAt:4}); await bsay(hero.name+' cae de rodillas... todo se vuelve oscuro.',70); return 'lose'; }
      }
    }
  }
}
async function victory(){
  const B=battle, e=B.enemy;
  playMusic(null); SFX.victory();
  if(knight.moving) await knight.moveTo(KNIGHT_X,'walk',3);
  knight.play('jump');                                                   // salta de alegría
  await bsay(B.boss ? '¡Ignaroth se desploma con un rugido que hace temblar la montaña!' : '¡Has derrotado a '+theName(e)+'!', 55);
  if(B.boss) return;
  const gold=e.gold+rnd(Math.ceil(e.gold*0.4)+1);
  hero.gold+=gold+e.stolen;
  await bsay('Obtienes '+e.xp+' PX y '+gold+' monedas de oro.'+(e.stolen?' Recuperas las '+e.stolen+' monedas robadas.':''),60);
  if(Math.random()<0.15){ hero.items.pocion++; await bsay(cap(theName(e))+' dejó caer una Poción.',45); }
  await gainXp(e.xp);
}
async function encounter(id, boss=false){
  busy++;
  try{
    SFX.encounter(); flashWhite(8); playMusic(boss?'boss':'battle');
    await transition('swirl',()=>{ setupBattle(id,boss); scene='battle'; },26);
    const res=await battleLoop();
    if(res==='lose') await gameOver();
    else if(res==='win' && boss) await bossEnding();
    else await transition('fade',()=>{ scene='world'; battle=null; playMusic(map.music); },14);
  } finally { busy--; }
}
async function gameOver(){
  await transition('fade',()=>{ scene='gameover'; battle=null; playMusic(null); SFX.gameover(); },30);
  await waitOk();
  await transition('fade',()=>{ hero.hp=HS.maxhp(); hero.mp=HS.maxmp(); hero.gold=Math.floor(hero.gold/2); loadMap('village',16,12,'up'); scene='world'; },24);
  await say('Despiertas en la posada de Robledal. Marta te ha cuidado toda la noche, pero has perdido la mitad de tu oro.',{name:'Marta'});
}
async function bossEnding(){
  flags.boss=true;
  await transition('fade',()=>{ scene='ending'; battle=null; ending={t:0}; playMusic('title'); },45);
  await waitOk();
  await transition('fade',()=>{ loadMap('village',5,7,'up'); scene='world'; saveGame(); autosave(true); },30);
  await say('La partida se ha guardado. Puedes seguir explorando Valdoria y hablar con los aldeanos.');
}

const STARS = Array.from({length:60},(_,i)=>({x:(i*97)%W, y:(i*53)%120, p:i*17}));

// ---------- actualización ----------
function onArrive(){
  const w=map.warps.find(w=>pl.x>=w.x1&&pl.x<=w.x2&&pl.y>=w.y1&&pl.y<=w.y2);
  if(w){ runScript(()=>warpTo(w)); return true; }
  if(map.enc){
    steps++;
    const t=tileAt(pl.x,pl.y);
    const rate = map.id==='cave' ? 0.08 : t==='"' ? 0.13 : t===':' ? 0.03 : t==='=' ? 0 : 0.07;
    if(steps>=5 && Math.random()<rate){ steps=0; const id=pickEnemy(); runScript(()=>encounter(id,false)); return true; }
  }
  return false;
}
function updateWorld(){
  if(banner && banner.t>0) banner.t--;
  if(busy) return;
  if(pl.moving){
    pl.prog+=1/10; pl.walk++;
    if(pl.prog>=1){ pl.x=pl.tx; pl.y=pl.ty; pl.moving=false; pl.prog=0; if(onArrive()) return; }
    else return;
  }
  if(consume('cancel')){ runScript(pauseMenu); return; }
  if(consume('ok')){ runScript(interact); return; }
  const on = k => held[k] || padHeld[k] || pressed[k];
  const d = on('up')?'up':on('down')?'down':on('left')?'left':on('right')?'right':null;
  if(d){
    pl.dir=d; const [dx,dy]=DIRS[d];
    if(walkable(pl.x+dx,pl.y+dy)){ pl.tx=pl.x+dx; pl.ty=pl.y+dy; pl.moving=true; pl.prog=0; }
    else pl.walk=0;
  } else pl.walk=0;
}
function updateBattleAnim(){
  knight.update(1000/60);
  const B=battle; if(!B) return;
  const e=B.enemy;
  if(e.flash>0) e.flash--; if(e.lunge>0) e.lunge--; if(e.dying>=0 && e.dying<40) e.dying++;
  if(e.sq>0) e.sq--; if(B.heroShake>0) B.heroShake--;
  for(const p of B.parts){ p.x+=p.vx; p.y+=p.vy; p.life--; if(p.drag){ p.vx*=0.86; p.vy*=0.86; } }
  B.parts=B.parts.filter(p=>p.life>0);
  for(const f of B.fx) f.t++;
  B.fx=B.fx.filter(f=>f.t<f.dur);
  if(B.boss && Math.random()<0.3) B.parts.push({ x:rnd(W), y:150, vx:(Math.random()-.5)*0.3, vy:-(0.3+Math.random()*0.8), life:60+rnd(60), max:120, col:Math.random()<.5?'#ff8a3d':'#ffcd75', s:1 });
  B.dispHp += (hero.hp-B.dispHp)*0.15; B.dispMp += (hero.mp-B.dispMp)*0.15; B.dispE += (e.hp-B.dispE)*0.15;
}
function newGame(){
  hero=newHero(); flags={ chests:{} }; playFrames=0;
  loadMap('village',5,8,'up'); scene='world';
  runScript(async()=>{
    await wait(30);
    await say('Reino de Valdoria, año 1247. Desde hace tres lunas, una lluvia de ceniza cubre el cielo...');
    await say('El dragón Ignaroth ha despertado de su largo sueño, y las aldeas del este viven aterradas.');
    await say('En Robledal, un joven escudero llamado Aldren está a punto de descubrir su destino.');
    await say('(Habla con el Anciano Eldric: acércate, mírale y pulsa Z o ENTER. Pulsa X para abrir el menú.)');
  });
}
function continueGame(){
  const s=newestSave(); if(!s || !s.data) return;
  const d=s.data;
  hero=d.hero; flags=d.flags; playFrames=d.time||0;
  hero.hp=clamp(Math.round(hero.hp),1,HS.maxhp()); hero.mp=clamp(Math.round(hero.mp),0,HS.maxmp());
  loadMap(d.map,d.x,d.y,d.dir); scene='world';
  if(SOLID.has(tileAt(d.x,d.y)) || entAt(d.x,d.y)) loadMap('village',5,8,'up');   // posición imposible: volver a la aldea
  if(s.backup) runScript(()=>say('La partida principal estaba dañada. Se ha cargado la copia de seguridad.'));
}
function updateTitle(){
  const hasSave=!!(titleSave && titleSave.data);
  if(pressed.up){ titleSel=(titleSel+2)%3; SFX.blip(); }
  if(pressed.down){ titleSel=(titleSel+1)%3; SFX.blip(); }
  if(pressed.ok){
    if(titleSel===1 && !hasSave){ SFX.buzz(); return; }
    SFX.ok();
    if(titleSel===2){ runScript(optionsMenu); return; }
    transition('fade',()=>{ if(titleSel===0) newGame(); else continueGame(); },20);
  }
}
function update(){
  frame++;
  pollPad();
  musicTick();
  if(pressed.mute){ toggleMute(); }
  // El temblor y los destellos corren en tiempo real, también durante el parón de impacto.
  if(trauma>0) trauma=Math.max(0,trauma-0.02); shakeT+=0.5;
  if(hurtFlash>0) hurtFlash--; if(whiteFlash>0) whiteFlash--; if(saveIcon>0) saveIcon--;
  if(hitStop>0){
    hitStop--;                       // parón de impacto: la pose, los textos y los temporizadores se congelan
  } else {
    for(let i=timers.length-1;i>=0;i--){ if(--timers[i].f<=0){ const t=timers[i]; timers.splice(i,1); t.res(); } }
    for(const p of popups) p.t++;
    for(let i=popups.length-1;i>=0;i--) if(popups[i].t>50) popups.splice(i,1);
    if(scene==='battle') updateBattleAnim();
    if(scene==='title' && KN.ready){
      titleKnight.update(1000/60);
      if(++titleDemo.t>150){ titleDemo.t=0; titleDemo.i=(titleDemo.i+1)%titleDemo.list.length; titleKnight.play(titleDemo.list[titleDemo.i],{flip:true}); }
    }
    for(const p of wparts){ p.x+=p.vx; p.y+=p.vy; p.life--; if(p.drag){ p.vx*=0.86; p.vy*=0.86; } }
    for(let i=wparts.length-1;i>=0;i--) if(wparts[i].life<=0) wparts.splice(i,1);
  }
  if(scene==='ending' && ending) ending.t++;
  if(scene==='world' || scene==='battle') playFrames++;
  if(trans){
    trans.t++;
    if(trans.t===trans.dur && trans.mid) trans.mid();
    if(trans.t>=trans.dur*2){ const r=trans.res; trans=null; r(); }
  } else if(modals.length){
    modals[modals.length-1].update();
  } else if(okWaiter && pressed.ok && (scene!=='ending' || (ending && ending.t>ENDING_LINES.length*70+60))){
    const r=okWaiter; okWaiter=null; SFX.ok(); r();
  } else if(scene==='title') updateTitle();
  else if(scene==='world') updateWorld();
  // Las pulsaciones hechas durante un diálogo, un menú o una transición no pasan al mundo.
  if(modals.length || trans || busy || scene!=='world') clearBuffer();
  for(const k in pressed) pressed[k]=false;
}

// ---------- dibujo ----------
function drawTile(ch,x,y,sx,sy){
  const set=TILESETS[map.theme];
  if(map.theme==='cave' && ch==='X' && tileAt(x,y+1)!=='X') ch='Xf';
  const e=set[ch]||set[map.base];
  const img = e.anim ? e.anim[Math.floor(frame/16)%e.anim.length] : e[hash(x,y)%e.length];
  ctx.drawImage(img,sx,sy);
}
function shadowAt(x,y,w=10){ ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x+8-w/2,y+14,w,2); ctx.fillRect(x+8-w/2+1,y+13,w-2,4); }
function drawWorld(){
  const mw=grid[0].length*TS, mh=grid.length*TS;
  const px=(pl.x+(pl.tx-pl.x)*pl.prog)*TS, py=(pl.y+(pl.ty-pl.y)*pl.prog)*TS;
  const camX=Math.round(clamp(px+8-W/2,0,mw-W)), camY=Math.round(clamp(py+8-H/2,0,mh-H));
  const x0=Math.floor(camX/TS), y0=Math.floor(camY/TS);
  for(let ty=y0; ty<=y0+H/TS+1; ty++) for(let tx=x0; tx<=x0+W/TS+1; tx++){
    if(ty<0||tx<0||ty>=grid.length||tx>=grid[0].length) continue;
    drawTile(grid[ty][tx],tx,ty,tx*TS-camX,ty*TS-camY);
  }
  const list = ents.map(e=>({e, y:e.y*TS})).concat([{p:true, y:py}]);
  list.sort((a,b)=>a.y-b.y);
  for(const it of list){
    if(it.p){
      const sx=Math.round(px-camX), sy=Math.round(py-camY);
      shadowAt(sx,sy);
      const fr = pl.moving ? Math.floor(pl.walk/6)%2 : 0;
      ctx.drawImage(SPR[pl.dir][fr], sx, sy-2);
      continue;
    }
    const e=it.e, sx=e.x*TS-camX, sy=e.y*TS-camY;
    if(sx<-40||sy<-40||sx>W+8||sy>H+8) continue;
    if(e.type==='npc'){ shadowAt(sx,sy); const bob=Math.floor((frame+e.x*13)/30)%2; ctx.drawImage(SPR[e.spr],sx,sy-2-bob); }
    else if(e.type==='chest') ctx.drawImage(flags.chests[e.id]?SPR.chestOpen:SPR.chest,sx,sy);
    else if(e.type==='sign') ctx.drawImage(SPR.sign,sx,sy);
    else if(e.type==='boss'){ ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(sx+4,sy+28,26,4); ctx.drawImage(SPR.dragon,sx,sy+4+Math.round(Math.sin(frame/25)*1.5)); }
  }
  for(const p of wparts){ ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1); ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),p.s,p.s); }
  ctx.globalAlpha=1;
  if(saveIcon>0 && Math.floor(saveIcon/10)%2===0) txt('Guardando...',W-8,H-14,'#ffcd75','right');
  // HUD
  if(!modals.length || modals[modals.length-1] instanceof Chooser){
    box(4,H-34,136,30);
    txt('PV '+hero.hp+'/'+HS.maxhp(),10,H-28, hero.hp/HS.maxhp()<=0.25?'#ff8a8a':'#f4f4f4');
    txt('PM '+hero.mp+'/'+HS.maxmp(),10,H-17,'#a9d6ff');
    txt('Nv'+hero.lv,134,H-28,'#ffcd75','right'); txt(hero.gold+'G',134,H-17,'#ffcd75','right');
  }
  if(banner && banner.t>0){
    ctx.globalAlpha = Math.min(1, banner.t/20, (150-banner.t)/15+0.001);
    const w=banner.text.length*8+28; box((W-w)/2,10,w,22); txt(banner.text,W/2,17,'#ffcd75','center');
    ctx.globalAlpha=1;
  }
}
function pxLine(x0,y0,x1,y1,col,s){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0; ctx.fillStyle=col; for(let i=0;i<=n;i++){ const t=n?i/n:0; ctx.fillRect(Math.round(x0+(x1-x0)*t-s/2),Math.round(y0+(y1-y0)*t-s/2),s,s); } }
function drawBattle(){
  const B=battle, e=B.enemy, sp=SPR[e.spr];
  ctx.drawImage(B.bg,0,0);
  ctx.fillStyle='#0e0d16'; ctx.fillRect(0,152,W,88);
  let s=e.scale, w=sp.width*s, h=sp.height*s, x=ENEMY_X-w/2, y=132-h;
  y += Math.round(Math.sin(frame/18)*2);
  if(e.lunge>0){ const k=Math.sin((1-e.lunge/14)*Math.PI); const g=1+0.12*k; w*=g; h*=g; x=ENEMY_X-w/2; y=132-h+k*6; }
  if(e.sq>0){ const v=1-easeOutBack(1-e.sq/12); w*=1+0.28*v; h*=1-0.28*v; x=ENEMY_X-w/2; y=132-h; }   // aplastar y estirar al recibir un golpe
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(ENEMY_X-w*0.35,130,w*0.7,4);
  ctx.fillRect(Math.round(knight.x-14),FEET_Y-4,28,4);
  knight.draw(FEET_Y, KS);
  if(e.dying<0 || e.dying<30){
    ctx.globalAlpha = e.dying>=0 ? Math.max(0,1-e.dying/30) : 1;
    const img = (e.flash>0 && e.flash%4<2) || (e.dying>=0 && e.dying%4<2) ? SPR[e.spr+'_w'] : sp;
    ctx.drawImage(img, Math.round(x), Math.round(y + (e.dying>0?e.dying*0.6:0)), Math.round(w), Math.round(h));
    ctx.globalAlpha=1;
  }
  for(const f of B.fx){
    if(f.type==='slash'){ const p=Math.min(1,f.t/7), x0=f.cx+f.w*0.45, y0=f.cy-f.h*0.45; const x1=x0-(f.w*0.9)*p, y1=y0+(f.h*0.9)*p; pxLine(x0,y0,x1,y1,'#ffcd75',5); pxLine(x0,y0,x1,y1,'#ffffff',3); }
    if(f.type==='arrow'){ const p=Math.min(1,f.t/f.dur), x=Math.round(f.x0+(f.x1-f.x0)*p), y=f.y;
      ctx.fillStyle='#4a2c14'; ctx.fillRect(x-18,y-1,20,4); ctx.fillStyle='#8b5a2b'; ctx.fillRect(x-17,y,18,2);
      ctx.fillStyle='#d0465a'; ctx.fillRect(x-20,y-2,4,2); ctx.fillRect(x-20,y+2,4,2);
      ctx.fillStyle='#1a1c2c'; ctx.fillRect(x+1,y-2,6,6); ctx.fillStyle='#e2e8f0'; ctx.fillRect(x+2,y-1,4,4); }
    if(f.type==='bolt'){ for(let i=0;i<f.pts.length-1;i++){ const [a,b]=f.pts[i], [c,d]=f.pts[i+1]; pxLine(a,b,c,d,'#ffcd75',5); pxLine(a,b,c,d,'#ffffff',2); } }
  }
  for(const p of B.parts){ ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1); ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s); }
  ctx.globalAlpha=1;
  // estado del héroe
  const hx = B.heroShake>0 ? Math.round(Math.sin(B.heroShake*1.9)*B.heroShake/4) : 0;   // la caja del héroe se sacude al recibir daño
  box(4+hx,4,100,52);
  txt(hero.name.toUpperCase(),10+hx,10,'#ffcd75'); txt('Nv'+hero.lv,98+hx,10,'#f4f4f4','right');
  txt('PV',10+hx,22,'#c9a25a'); txt(Math.round(B.dispHp)+'/'+HS.maxhp(),98+hx,22,'#f4f4f4','right');
  bar(10+hx,31,88,4,B.dispHp/HS.maxhp(),hpCol(hero.hp/HS.maxhp()));
  txt('PM',10+hx,38,'#c9a25a'); txt(Math.round(B.dispMp)+'/'+HS.maxmp(),98+hx,38,'#f4f4f4','right');
  bar(10+hx,47,88,4,B.dispMp/HS.maxmp(),'#5aa0ff');
  // enemigo
  if(e.dying<0){ box(216,4,100,30); txt(e.name,222,10,B.boss?'#ff8a6a':'#f4f4f4'); bar(222,22,88,5,B.dispE/e.maxhp,hpCol(e.hp/e.maxhp)); }
  if(!modals.length) box(BATTLE_BOX.x,BATTLE_BOX.y,BATTLE_BOX.w,BATTLE_BOX.h);
}
function drawTitle(){
  ctx.drawImage(BG.title,0,0);
  for(const s of STARS){ if((frame+s.p)%120<100){ ctx.fillStyle=(s.p%3)?'#ffffff':'#ffe39a'; ctx.fillRect(s.x,s.y,1,1); if(s.p%7===0){ ctx.fillRect(s.x-1,s.y,3,1); ctx.fillRect(s.x,s.y-1,1,3); } } }
  const dx = W+40 - ((frame*0.6)%(W+120));
  ctx.drawImage(SPR.dragonShadow, Math.round(dx), 112+Math.round(Math.sin(frame/30)*4));
  txt('Crónicas de',W/2,40,'#e8dcc0','center');
  bigTxt('VALDORIA',W/2,54,24,'#ffcd75','#6e1f35');
  txt('La ceniza del dragón',W/2,88,'#c9a25a','center');
  if(KN.ready){ titleKnight.x=286; titleKnight.flip=true; ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(272,231,28,3); titleKnight.draw(234,1); }
  const hasSave=!!(titleSave && titleSave.data);
  box(W/2-70,150,140,52);
  const opts=['Nueva partida','Continuar','Opciones'];
  opts.forEach((o,i)=>{ const col = i===1&&!hasSave ? '#6b6f80' : (i===titleSel?'#ffcd75':'#f4f4f4'); txt(o,W/2-48,158+i*14,col); });
  if(!modals.length && Math.floor(frame/20)%3!==2) tri(W/2-60,158+titleSel*14);
  let info='Z / ENTER para empezar';
  if(titleSel===1){
    if(hasSave){ const d=titleSave.data; info='Nv '+d.hero.lv+' · '+MAPS[d.map].name+' · '+fmtTime(d.time||0); }
    else if(titleSave && titleSave.error==='newer') info='Partida de una versión más nueva';
    else if(titleSave && titleSave.error==='blocked') info='El navegador bloquea el guardado';
    else info='No hay ninguna partida guardada';
  }
  txt(info,W/2,214,'#c9a25a','center');
}
const ENDING_LINES = [
  'Con un último rugido, Ignaroth cae.',
  'La ceniza deja de caer sobre Valdoria.',
  'Por primera vez en meses, sale el sol.',
  'Robledal recibe a Aldren entre vítores.',
  'El Rey lo nombra caballero:',
  'Sir Aldren de Robledal, Matadragones.',
];
function drawEnding(){
  ctx.drawImage(BG.dawn,0,0);
  const t=ending?ending.t:0;
  ENDING_LINES.forEach((l,i)=>{ const a=clamp((t-i*70)/40,0,1); if(a<=0) return; ctx.globalAlpha=a; txt(l,W/2,22+i*16,'#fff4d8','center'); });
  ctx.globalAlpha=1;
  const done=t>ENDING_LINES.length*70+60;
  if(done){
    bigTxt('FIN',W/2,128,24,'#ffcd75','#6e1f35');
    txt('Nivel '+hero.lv+'  ·  Tiempo '+fmtTime(playFrames),W/2,162,'#fff4d8','center');
    if(Math.floor(frame/30)%2===0) txt('¡Gracias por jugar! Pulsa Z',W/2,222,'#ffffff','center');
  }
}
function drawGameOver(){
  ctx.fillStyle='#120608'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ ctx.fillStyle='rgba(110,31,53,0.35)'; ctx.fillRect((i*71+frame/3)%W,(i*37+frame*0.6)%H,2,2); }
  bigTxt('HAS CAIDO',W/2,90,16,'#e04f5f','#3a0a12');
  txt('Pero la leyenda no termina aquí...',W/2,124,'#c9a25a','center');
  if(Math.floor(frame/30)%2===0) txt('Pulsa Z para continuar',W/2,170,'#f4f4f4','center');
}
function draw(){
  ctx.save();
  if(trauma>0 && scene!=='title'){ const k=trauma*trauma*settings.shake; ctx.translate(Math.round(7*k*Math.sin(shakeT*1.7)), Math.round(5*k*Math.sin(shakeT*2.3))); }
  ctx.fillStyle='#000'; ctx.fillRect(-10,-10,W+20,H+20);
  if(scene==='title') drawTitle();
  else if(scene==='world') drawWorld();
  else if(scene==='battle' && battle) drawBattle();
  else if(scene==='ending') drawEnding();
  else if(scene==='gameover') drawGameOver();
  else if(scene==='loading'){ txt('Cargando...',W/2,H/2-4,'#c9a25a','center'); }
  ctx.restore();
  if(hurtFlash>0){ ctx.fillStyle='rgba(224,79,95,'+(hurtFlash/10*(settings.flash?0.35:0.15))+')'; ctx.fillRect(0,0,W,H); }
  for(const m of modals) m.draw();
  for(const p of popups){
    // Número que "salta": crece por encima de su tamaño y se asienta (easeOutBack), luego sube y se desvanece.
    const rest=p.big?16:8, k=easeOutBack(Math.min(1,p.t/8)), size=p.t<8 ? Math.round(rest*(1.9-0.9*k)/2)*2 : rest;
    const y=p.y-Math.min(p.t,14)*1.3-size/2+4;
    ctx.globalAlpha=p.t>38?Math.max(0,1-(p.t-38)/12):1; bigTxt(p.text,p.x,Math.round(y),Math.max(8,size),p.col,'#0b0a12'); ctx.globalAlpha=1;
  }
  if(whiteFlash>0){ ctx.fillStyle='rgba(255,255,255,'+(whiteFlash/8*0.8)+')'; ctx.fillRect(0,0,W,H); }
  if(trans){
    const t=trans.t, d=trans.dur, p = t<d ? t/d : 1-(t-d)/d;
    if(trans.kind==='swirl' && t<d){ const n=Math.floor(SWIRL.length*p); ctx.fillStyle='#000'; for(let i=0;i<n;i++){ const c=SWIRL[i]; ctx.fillRect(c.x*16,c.y*16,16,16); } }
    else { ctx.fillStyle='rgba(0,0,0,'+clamp(p,0,1)+')'; ctx.fillRect(0,0,W,H); }
  }
}

// ---------- bucle principal ----------
let last=performance.now(), acc=0;
function loop(now){
  acc += Math.min(100, now-last); last=now;
  while(acc>=1000/60){ update(); acc-=1000/60; }
  draw();
  requestAnimationFrame(loop);
}
async function boot(){
  resize();
  buildSprites(); buildTiles();
  BG.forest=forestBG(); BG.cave=caveBG(false); BG.lair=caveBG(true); BG.title=titleBG(); BG.dawn=dawnBG();
  requestAnimationFrame(loop);
  try{ await Promise.race([ document.fonts.load(FONT), new Promise(r=>setTimeout(r,2500)) ]); await document.fonts.load('24px "Press Start 2P"'); }catch(e){}
  await loadKnight();
  titleSave=newestSave();
  scene='title'; playMusic('title');
}
// acceso para pruebas desde la consola
window.RPG = { get hero(){return hero;}, get flags(){return flags;}, get scene(){return scene;}, get map(){return map&&map.id;}, get pos(){return pl&&[pl.x,pl.y];},
  get ui(){ return { modals:modals.map(m=>m.constructor.name), busy, trans:!!trans, text: modals.length && modals[modals.length-1].pages ?modals[modals.length-1].pages.flat().join(' ') : '' }; },
  validateDialogues:()=>validateDialogues(), evalExpr:(e,v)=>evalExpr(e,v), questLog:()=>questLog(), settings, HS:()=>({atk:HS.atk(),def:HS.def(),maxhp:HS.maxhp()}),
  exportArt:()=>{ const o={}; for(const k in SPR){ const v=SPR[k]; if(Array.isArray(v)) v.forEach((c,i)=>o[k+'_'+i]=c.toDataURL()); else o[k]=v.toDataURL(); } for(const th in TILESETS) for(const ch in TILESETS[th]){ const e=TILESETS[th][ch]; (e.anim||e).forEach((c,i)=>o['tile_'+th+'_'+(ch==='"'?'tall':ch==='.'?'dot':ch===':'?'path':ch===','?'flower':ch==='~'?'water':ch==='='?'bridge':ch)+'_'+i]=c.toDataURL()); } return o; },
  get knight(){ return { clip:knight.clip, i:knight.i, x:Math.round(knight.x), ready:KN.ready, clips:KNIGHT?Object.keys(KNIGHT.clips):[] }; },
  debugFeel:()=>({hitStop, trauma, sq: battle?battle.enemy.sq:0}), save:()=>saveGame(), readSlot:k=>readSlot(k),
  newGame:()=>newGame(), warp:(id,x,y)=>loadMap(id,x,y,'down'), fight:id=>{ if(busy||scene!=='world') return false; runScript(()=>encounter(id,id==='dragon')); return true; }, grid:()=>grid, walkable:(x,y)=>walkable(x,y), ents:()=>ents };
boot();
